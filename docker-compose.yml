# docker-compose.yml — Assurance Toto (profil FULL)
# Étend le profil lite : même socle (postgres, redis, gitea, searxng, mailhog,
# mcp-git, Buzz = relais + postgres-buzz + minio + minio-init, bridge,
# presidio) et ajoute les 4 départements restants (finance, support-client,
# marketing, conformite-it) + NATS (profil optionnel "nats").
#
# Démarrage démo complète :
#   docker compose -f docker-compose.yml --env-file .env up -d
# Avec NATS (bus d'événements inter-agents, Phase-2) :
#   docker compose -f docker-compose.yml --env-file .env --profile nats up -d
#
# twenty-crm n'est PAS intégré ici : son déploiement propre (postgres dédié,
# redis, worker, ~1,5–2 Go RAM) le rend optionnel Phase-2. Voir README.
#
# Rocket.Chat + MongoDB retirés (canal remplacé par Buzz) :
# docker-compose.legacy-rocketchat.yml + setup-hermes-windows/.
# Tags non épinglés acceptés uniquement pour ghcr.io/block/buzz:main et
# mcr.microsoft.com/presidio-analyzer (cf. ADR-001).

name: assurance-toto

networks:
  net-core:
    driver: bridge
  net-dept:
    driver: bridge
  net-external:
    driver: bridge

volumes:
  pg_data:
  gitea_data:
  buzz_pg_data:
  buzz_git_data:
  minio_data:
  hermes_orch_home:
  hermes_sales_home:
  hermes_uw_home:
  hermes_claims_home:
  hermes_finance_home:
  hermes_support_home:
  hermes_mkt_home:
  hermes_comp_home:
  nats_data:

x-hermes-agent: &hermes-agent
  restart: unless-stopped
  networks: [net-dept]
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-hermes-env: &hermes-env
  OLLAMA_HOST: ${OLLAMA_HOST}
  OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL}
  LOG_LEVEL: ${HERMES_LOG_LEVEL:-info}
  DATABASE_URL: postgres://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  BRIDGE_URL: http://buzz-hermes-bridge:3100
  PRESIDIO_URL: http://presidio-analyzer:3000
  HERMES_ESCALATION_THRESHOLD_EUR: ${HERMES_ESCALATION_THRESHOLD_EUR}

services:

  # ============ INFRASTRUCTURE MÉTIER ============

  postgres:
    image: pgvector/pgvector:pg16
    container_name: toto-postgres
    restart: unless-stopped
    networks: [net-core]
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "${PG_PORT:-5432}:5432"   # exposition locale pour seed (host)/health ; accès inter-conteneurs inchangé
    volumes:
      # initdb exécute les .sql par ordre alphabétique — ordre forcé 00→02
      - ./infra/postgres/init_extensions.sql:/docker-entrypoint-initdb.d/00_extensions.sql:ro
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./infra/postgres/schema_v2.sql:/docker-entrypoint-initdb.d/02_schema_v2.sql:ro
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: toto-redis
    restart: unless-stopped
    networks: [net-core, net-dept]
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  gitea:
    image: gitea/gitea:1.22
    container_name: toto-gitea
    restart: unless-stopped
    networks: [net-dept]
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: ${GITEA_DOMAIN}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL}
    volumes:
      - gitea_data:/data
    ports:
      - "${GITEA_PORT:-3010}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  searxng:
    image: searxng/searxng:latest
    container_name: toto-searxng
    restart: unless-stopped
    networks: [net-external]
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: toto-mailhog
    restart: unless-stopped
    networks: [net-external, net-dept]
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  mcp-git:
    build: ./infra/git-mcp
    container_name: toto-mcp-git
    restart: unless-stopped
    networks: [net-dept]
    environment:
      GITEA_REPO_URL: ${GITEA_REPO_URL}
      GITEA_ACCESS_TOKEN: ${GITEA_ACCESS_TOKEN}
    depends_on:
      gitea:
        condition: service_healthy

  # ============ SOUS-SYSTÈME BUZZ (identique au profil lite) ============

  postgres-buzz:
    image: postgres:17-alpine
    container_name: toto-buzz-postgres
    restart: unless-stopped
    networks: [net-core]
    environment:
      POSTGRES_DB: ${BUZZ_PG_DB}
      POSTGRES_USER: ${BUZZ_PG_USER}
      POSTGRES_PASSWORD: ${BUZZ_PG_PASSWORD}
    volumes:
      - buzz_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BUZZ_PG_USER} -d ${BUZZ_PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: toto-minio
    restart: unless-stopped
    networks: [net-core]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: toto-minio-init
    networks: [net-core]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/buzz-media;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  buzz:
    # Image publiée du relais Buzz — pull uniquement. Épinglement « :main »
    # assumé : ADR-001.
    image: ghcr.io/block/buzz:main
    container_name: toto-buzz
    restart: unless-stopped
    networks: [net-core, net-dept]
    environment:
      DATABASE_URL: postgres://${BUZZ_PG_USER}:${BUZZ_PG_PASSWORD}@postgres-buzz:5432/${BUZZ_PG_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BUZZ_S3_ENDPOINT: http://minio:9000
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      BUZZ_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET}
      BUZZ_GIT_REPO_PATH: /data/git
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_WEB_DIR: /srv/buzz/web
      RELAY_OWNER_PUBKEY: ${RELAY_OWNER_PUBKEY}
      BUZZ_RELAY_PRIVATE_KEY: ${BUZZ_RELAY_PRIVATE_KEY}
      BUZZ_REQUIRE_AUTH_TOKEN: "true"
    volumes:
      - buzz_git_data:/data/git
    ports:
      - "3002:3000"
      - "8081:8080"
    depends_on:
      postgres-buzz:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # node absent de l'image Buzz (Rust) ; endpoint réel exposé : /_liveness sur le port santé 8080.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/_liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  buzz-hermes-bridge:
    build: ./buzz-hermes-bridge
    container_name: toto-buzz-hermes-bridge
    restart: unless-stopped
    networks: [net-core, net-dept]
    environment:
      DATABASE_URL: postgres://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BUZZ_RELAY_URL: http://buzz:3000
      BUZZ_PRIVATE_KEY: ${BUZZ_PRIVATE_KEY}
      BRIDGE_CEOPUBKEYS: ${BRIDGE_CEOPUBKEYS}
      BRIDGE_ALLOWED_UNSIGNED_ROLES: ${BRIDGE_ALLOWED_UNSIGNED_ROLES}
      BRIDGE_REQUIRE_SIGNED_COMMANDS: ${BRIDGE_REQUIRE_SIGNED_COMMANDS}
      CLAIM_SETTLEMENT_THRESHOLD_EUR: ${CLAIM_SETTLEMENT_THRESHOLD_EUR}
      PORT: "3100"
    ports:
      - "3100:3100"
    depends_on:
      buzz:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  presidio-analyzer:
    # Image Microsoft ; tag « latest » assumé (ADR-001).
    image: mcr.microsoft.com/presidio-analyzer:latest
    container_name: toto-presidio-analyzer
    restart: unless-stopped
    networks: [net-core, net-dept]
    ports:
      - "3003:3000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000/health').status==200 else 1)\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============ BUS D'ÉVÉNEMENTS (OPTIONNEL — profil "nats") ============

  nats:
    image: nats:2.10-alpine
    container_name: toto-nats
    restart: unless-stopped
    profiles: ["nats"]
    networks: [net-core]
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============ AGENTS MVP (identiques au profil lite) ============

  agent-orchestrateur:
    <<: *hermes-agent
    build:
      context: .
      dockerfile: agents/orchestrateur/Dockerfile
    container_name: toto-agent-orchestrateur
    volumes:
      - ./agents/orchestrateur:/home/agent/workspace:ro
      - ./security/mcp-allowlist.json:/home/agent/mcp-allowlist.json:ro
      - hermes_orch_home:/home/agent/.hermes
    environment:
      <<: *hermes-env
      OLLAMA_MODEL: ${OLLAMA_MODEL_PRIMARY}
      HERMES_APPROVAL_MODE: ${HERMES_APPROVAL_MODE}
      AGENT_ROLE: orchestrateur
      MEMORY_DEPARTEMENT: orchestrateur
      AGENT_NPUB: ${AGENT_NPUB_ORCHESTRATEUR:-}
      AGENT_NSEC: ${AGENT_NSEC_ORCHESTRATEUR:-}
    depends_on:
      redis:
        condition: service_healthy
      mcp-git:
        condition: service_started
      buzz-hermes-bridge:
        condition: service_started

  agent-sales:
    <<: *hermes-agent
    build:
      context: .
      dockerfile: agents/sales/Dockerfile
    container_name: toto-agent-sales
    networks: [net-dept, net-external]
    volumes:
      - ./agents/sales:/home/agent/workspace:ro
      - ./security/mcp-allowlist.json:/home/agent/mcp-allowlist.json:ro
      - hermes_sales_home:/home/agent/.hermes
    environment:
      <<: *hermes-env
      OLLAMA_MODEL: ${OLLAMA_MODEL_PRIMARY}
      AGENT_ROLE: sales
      MEMORY_DEPARTEMENT: sales
      AGENT_NPUB: ${AGENT_NPUB_SALES:-}
      AGENT_NSEC: ${AGENT_NSEC_SALES:-}
    depends_on:
      mailhog:
        condition: service_healthy
      buzz-hermes-bridge:
        condition: service_started

  agent-souscription:
    <<: *hermes-agent
    build:
      context: .
      dockerfile: agents/souscription/Dockerfile
    container_name: toto-agent-souscription
    volumes:
      - ./agents/souscription:/home/agent/workspace:ro
      - ./security/mcp-allowlist.json:/home/agent/mcp-allowlist.json:ro
      - hermes_uw_home:/home/agent/.hermes
    environment:
      <<: *hermes-env
      OLLAMA_MODEL: ${OLLAMA_MODEL_PRIMARY}
      AGENT_ROLE: souscription
      MEMORY_DEPARTEMENT: souscription
      AGENT_NPUB: ${AGENT_NPUB_SOUSCRIPTION:-}
      AGENT_NSEC: ${AGENT_NSEC_SOUSCRIPTION:-}
    depends_on:
      redis:
        condition: service_healthy
      presidio-analyzer:
        condition: service_started
      buzz-hermes-bridge:
        condition: service_started

  agent-sinistres-contentieux:
    <<: *hermes-agent
    build:
      context: .
      dockerfile: agents/sinistres-contentieux/Dockerfile
    container_name: toto-agent-sinistres
    networks: [net-dept, net-external]
    volumes:
      - ./agents/sinistres-contentieux:/home/agent/workspace:ro
      - ./security/mcp-allowlist.json:/home/agent/mcp-allowlist.json:ro
      - hermes_claims_home:/home/agent/.hermes
    environment:
      <<: *hermes-env
      OLLAMA_MODEL: ${OLLAMA_MODEL_FALLBACK}
      AGENT_ROLE: sinistres-contentieux
      MEMORY_DEPARTEMENT: sinistres-contentieux
      AGENT_NPUB: ${AGENT_NPUB_SINISTRES:-}
      AGENT_NSEC: ${AGENT_NSEC_SINISTRES:-}
    depends_on:
      mailhog:
        condition: service_healthy
      buzz-hermes-bridge:
        condition: service_started

  # ============ 4 AGENTS PHASE-2 ============

  agent-finance:
    <<: *hermes-agent
    build:
      context: .
      dockerfile: agents/finance/Dockerfile
    container_name: toto-agent-finance
    volumes:
      - ./agents/finance:/home/agent/workspace:ro
      - ./security/mcp-allowlist.json:/home/agent/mcp-allowlist.json:ro
      - hermes_finance_home:/home/agent/.hermes
    environment:
      <<: *hermes-env
      OLLAMA_MODEL: ${OLLAMA_MODEL_LONG_CTX}
      AGENT_ROLE: finance
      MEMORY_DEPARTEMENT: finance
      AGENT_NPUB: ${AGENT_NPUB_FINANCE:-}
      AGENT_NSEC: ${AGENT_NSEC_FINANCE:-}
    depends_on:
      postgres:
        condition: service_healthy
      buzz-hermes-bridge:
        condition: service_started

  agent-support-client:
    <<: *hermes-agent
    build:
      context: .
      dockerfile: agents/support-client/Dockerfile
    container_name: toto-agent-support-client
    volumes:
      - ./agents/support-client:/home/agent/workspace:ro
      - ./security/mcp-allowlist.json:/home/agent/mcp-allowlist.json:ro
      - hermes_support_home:/home/agent/.hermes
    environment:
      <<: *hermes-env
      OLLAMA_MODEL: ${OLLAMA_MODEL_PRIMARY}
      AGENT_ROLE: support-client
      MEMORY_DEPARTEMENT: support
      AGENT_NPUB: ${AGENT_NPUB_SUPPORT:-}
      AGENT_NSEC: ${AGENT_NSEC_SUPPORT:-}
    depends_on:
      mailhog:
        condition: service_healthy
      buzz-hermes-bridge:
        condition: service_started

  agent-marketing:
    <<: *hermes-agent
    build:
      context: .
      dockerfile: agents/marketing/Dockerfile
    container_name: toto-agent-marketing
    networks: [net-dept, net-external]
    volumes:
      - ./agents/marketing:/home/agent/workspace:ro
      - ./security/mcp-allowlist.json:/home/agent/mcp-allowlist.json:ro
      - hermes_mkt_home:/home/agent/.hermes
    environment:
      <<: *hermes-env
      OLLAMA_MODEL: ${OLLAMA_MODEL_PRIMARY}
      AGENT_ROLE: marketing
      MEMORY_DEPARTEMENT: marketing
      AGENT_NPUB: ${AGENT_NPUB_MARKETING:-}
      AGENT_NSEC: ${AGENT_NSEC_MARKETING:-}
    depends_on:
      buzz-hermes-bridge:
        condition: service_started

  agent-conformite-it:
    <<: *hermes-agent
    build:
      context: .
      dockerfile: agents/conformite-it/Dockerfile
    container_name: toto-agent-conformite-it
    volumes:
      - ./agents/conformite-it:/home/agent/workspace:ro
      - ./security/mcp-allowlist.json:/home/agent/mcp-allowlist.json:ro
      - hermes_comp_home:/home/agent/.hermes
    environment:
      <<: *hermes-env
      OLLAMA_MODEL: ${OLLAMA_MODEL_LONG_CTX}
      AGENT_ROLE: conformite-it
      MEMORY_DEPARTEMENT: conformite-it
      AGENT_NPUB: ${AGENT_NPUB_CONFORMITE:-}
      AGENT_NSEC: ${AGENT_NSEC_CONFORMITE:-}
    depends_on:
      presidio-analyzer:
        condition: service_started
      buzz-hermes-bridge:
        condition: service_started

# Note : le département RH (agents/rh) n'a pas de Dockerfile départemental —
# ajouter volontairement hors du profil full actuel. twenty-crm est documenté
# comme optionnel Phase-2 (README) ; gamification-engine et mcp-macro-wrapper,
# présents dans l'ancien setup Rocket.Chat, restent à réactiver via Phase-2.
# Matrice réseaux/ports : docs/NETWORKING.md.
