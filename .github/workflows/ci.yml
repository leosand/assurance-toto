name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (placeholder)
        run: echo "Add eslint or other linters as needed."

      - name: Test (placeholder)
        run: echo "Add Jest/Vitest or other test runners as needed."

      - name: Dependency audit
        run: npm audit --audit-level=moderate || true
